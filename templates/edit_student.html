<!DOCTYPE html>

<html>

<head>

    <title>Edit Student Details</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        .login-container {

            width: 450px;

            max-width: 95%;

        }

        input, select {

            width: 100%;

            padding: 12px;

            margin: 10px 0;

            box-sizing: border-box;

        }

        h1 {

            color: #333366;

        }

    </style>

</head>

<body>

<div class="login-container">

    <h1>Edit Student Details</h1>

    <form method="POST">

        <label>Student Name</label>

        <input type="text" name="name"

               value="{{ student.name }}" required>

        <label>Age</label>

        <input type="number" name="age"

               value="{{ student.age }}" required>

        <label>Gender</label>

        <select name="gender" required>

            <option value="Male" {% if student.gender == 'Male' %}selected{% endif %}>Male</option>

            <option value="Female" {% if student.gender == 'Female' %}selected{% endif %}>Female</option>

            <option value="Other" {% if student.gender == 'Other' %}selected{% endif %}>Other</option>

        </select>

        <label>Study Hours</label>

        <input type="number" step="0.1" name="study_hours"

               value="{{ student.study_hours }}" required>

        <label>Attendance (%)</label>

        <input type="number" step="0.1" name="attendance"

               value="{{ student.attendance }}" required>

        <label>Previous Marks</label>

        <input type="number" step="0.1" name="previous_marks"

               value="{{ student.previous_marks }}" required>

        <button type="submit">Update Student</button>

    </form>

    <br>

    <a href="/view_students">Back to Students</a>

</div>

</body>

</html>
